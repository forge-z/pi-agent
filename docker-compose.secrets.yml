# Opcional, para hosts com arquivos de secrets já provisionados:
# docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d --build
services:
  pi-agent:
    environment:
      WEB_PASSWORD: ""
      WEB_PASSWORD_FILE: /run/secrets/web_password
      # Ao habilitar os secrets Telegram abaixo, descomente também:
      # TELEGRAM_BOT_TOKEN: ""
      # TELEGRAM_WEBHOOK_SECRET: ""
      # TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
    secrets:
      - web_password
      # - telegram_bot_token
      # - telegram_webhook_secret

secrets:
  web_password:
    file: ${WEB_PASSWORD_SECRET_FILE:?Defina o caminho absoluto do arquivo de senha no host}
  # telegram_bot_token:
  #   file: ${TELEGRAM_BOT_TOKEN_SECRET_FILE:?Defina o arquivo do token do bot}
  # telegram_webhook_secret:
  #   file: ${TELEGRAM_WEBHOOK_SECRET_FILE:?Defina o arquivo do segredo do webhook}
