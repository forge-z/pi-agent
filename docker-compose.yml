services:
  pi-agent:
    build:
      context: .
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      APP_MODE: ${APP_MODE:-demo}
      MODEL_ID: ${MODEL_ID:-gpt-6.1-sol}
      APP_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN como a origem HTTPS publica}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      WEB_PASSWORD_FILE: /run/secrets/web_password
      MCP_CONFIG_FILE: ${MCP_CONFIG_FILE:-}
      # Ative quando provisionar os arquivos do bot no host:
      # TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
      # TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      # TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
    secrets:
      - web_password
      # Descomente ao ativar o Telegram:
      # - telegram_bot_token
      # - telegram_webhook_secret
    volumes:
      - pi_agent_data:/app/data
      # Se usar MCP, monte uma configuração revisada e somente leitura:
      # - ./config/mcp.json:/app/config/mcp.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 45s

volumes:
  pi_agent_data:

secrets:
  web_password:
    file: ${WEB_PASSWORD_SECRET_FILE:?Defina WEB_PASSWORD_SECRET_FILE em .env para um arquivo criado por voce}
  # Descomente os blocos correspondentes ao ativar o Telegram:
  # telegram_bot_token:
  #   file: ${TELEGRAM_BOT_TOKEN_SECRET_FILE:?Defina o arquivo do token do bot}
  # telegram_webhook_secret:
  #   file: ${TELEGRAM_WEBHOOK_SECRET_FILE:?Defina o arquivo do segredo do webhook}
